<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Скидка на доставку</title>
  <style>
    @font-face{font-family:'Avito Sans Text';src:url('./assets/avito-sans-text-regular.woff2') format('woff2');font-weight:400;font-display:swap}
    @font-face{font-family:'Avito Sans Text';src:url('./assets/avito-sans-text-medium.woff2') format('woff2');font-weight:500;font-display:swap}
    @font-face{font-family:'Avito Sans Text';src:url('./assets/avito-sans-text-semibold.woff2') format('woff2');font-weight:600;font-display:swap}
    @font-face{font-family:'Avito Sans Text';src:url('./assets/avito-sans-text-bold.woff2') format('woff2');font-weight:700;font-display:swap}
    @font-face{font-family:'Avito Sans Text';src:url('./assets/avito-sans-text-extrabold.woff2') format('woff2');font-weight:800;font-display:swap}
    :root{--black:#141414;--secondary:#757575;--control:#f2f1f0;--line:#dbdbd9;--white:#fff;--blue:#00aaff;--green:#d9fcc7;--lavender:#efe6fd}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f2f2f2;font-family:'Avito Sans Text',Arial,sans-serif;color:var(--black)}
    button,input{font:inherit}
    button{color:inherit}
    .boot,.viewer-choice{position:fixed;z-index:100;inset:0;display:flex;align-items:center;justify-content:center;background:#f2f2f2;padding:24px}
    .boot-card,.viewer-choice-card{width:min(100%,520px);background:#fff;border-radius:32px;padding:32px;box-shadow:0 18px 60px rgba(0,0,0,.08)}
    .boot-card{text-align:center}
    .boot-title{font-size:22px;line-height:26px;font-weight:700;margin:0 0 10px}
    .boot-copy{font-size:15px;line-height:20px;color:var(--secondary);margin:0}
    .boot-progress{height:4px;border-radius:4px;background:#e7e7e5;overflow:hidden;margin-top:24px}
    .boot-progress-bar{width:0;height:100%;border-radius:inherit;background:#111;transition:width .18s ease}
    .boot-retry{display:none;width:100%;height:48px;margin-top:24px;border:0;border-radius:14px;background:#111;color:#fff;cursor:pointer}
    .boot.error .boot-progress{display:none}
    .boot.error .boot-retry{display:block}
    .viewer-choice[hidden],.boot[hidden],.viewer-shell[hidden]{display:none}
    .viewer-choice-card h1{font-size:30px;line-height:34px;margin:0 0 8px;font-weight:800}
    .viewer-choice-card>p{font-size:16px;line-height:22px;color:var(--secondary);margin:0 0 28px}
    .viewer-options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .viewer-option{min-height:150px;border:0;border-radius:22px;background:var(--control);padding:20px;text-align:left;cursor:pointer;transition:transform .16s ease,background .16s ease}
    .viewer-option:hover{background:#e9e8e6;transform:translateY(-2px)}
    .viewer-option:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
    .viewer-option-preview{display:inline-flex;align-items:center;justify-content:center;width:max-content;height:28px;margin-bottom:22px;border-radius:9px;background:#111;color:#fff;padding:0 10px;font-size:11px;line-height:14px;font-weight:700;letter-spacing:.3px}
    .viewer-option strong{display:block;font-size:18px;line-height:22px;margin-bottom:4px}
    .viewer-option span{display:block;font-size:14px;line-height:18px;color:var(--secondary)}
    .viewer-shell{position:fixed;inset:0;display:grid;place-items:center}
    .viewer-shell.phone{background:#e8e8e8}
    .viewer-shell.desktop{background:#e8e8e8;--device-scale:1}
    .device-wrap{position:relative}
    .phone .device-wrap{position:relative;width:min(100%,375px);height:min(100%,812px)}
    .phone .device{position:absolute;inset:0;width:auto;height:auto;background:#fff}
    .desktop .device-wrap{width:calc(395px * var(--device-scale));height:calc(832px * var(--device-scale))}
    .desktop .device{position:absolute;left:0;top:0;width:375px;height:812px;box-sizing:content-box;border:10px solid #090909;border-radius:48px;background:#fff;box-shadow:0 24px 70px rgba(0,0,0,.24);overflow:hidden;transform:scale(var(--device-scale));transform-origin:0 0}
    .system-status,.system-home{display:none;background:#fff;position:relative;z-index:70;flex:none}
    .desktop .device{display:flex;flex-direction:column}
    .desktop .system-status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:13px;line-height:16px;font-weight:700}
    .desktop .system-status-right{font-size:11px;letter-spacing:.2px}
    .desktop .system-home{height:34px;display:flex;align-items:center;justify-content:center}
    .desktop .system-home::after{content:"";width:134px;height:5px;border-radius:5px;background:#111}
    .prototype-stage{position:relative;width:100%;height:100%;overflow:hidden;background:#fff}
    .desktop .prototype-stage{height:734px;flex:none}
    .app{position:relative;width:min(100%,375px);height:100dvh;margin:0 auto;background:#fff;overflow:hidden}
    .phone .app{width:100%;max-width:375px;height:100%;max-height:812px}
    .desktop .app{width:375px;height:734px;box-shadow:none}
    .scroll{height:100%;overflow-y:auto;overscroll-behavior:none;padding-bottom:62px;scrollbar-width:none}
    .app.has-selection .scroll{padding-bottom:220px}
    .scroll::-webkit-scrollbar,.chips-row::-webkit-scrollbar{display:none}
    .hero{position:relative;height:310px;border-radius:0 0 28px 28px;overflow:hidden}
    .hero-background{position:absolute;inset:0;background:radial-gradient(ellipse 300px 283px at 80% 20%,rgba(217,252,199,1),rgba(217,252,199,0) 100%),radial-gradient(ellipse 225px 212px at 0 100%,rgba(239,230,253,1),rgba(239,230,253,0) 100%),#edf0fe}
    .back{position:absolute;z-index:5;top:0;left:2px;width:48px;height:48px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer}
    .back img{width:24px;height:24px}
    .sticky-header{position:absolute;z-index:15;left:0;right:0;top:0;height:48px;background:#fff;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s}
    .sticky-header.visible{opacity:1;visibility:visible;pointer-events:auto}
    .sticky-header .back{top:0}
    .sticky-title{position:absolute;top:14px;left:0;right:0;text-align:center;font-size:16px;line-height:20px;font-weight:700}
    .hero-copy{position:absolute;z-index:2;left:16px;top:52px;width:220px}
    .hero-copy h1{font-size:26px;line-height:30px;margin:0 0 4px;font-weight:700;letter-spacing:0}
    .hero-copy p{font-size:15px;line-height:20px;margin:0;max-width:190px}
    .art-viewport{position:absolute;right:0;top:0;width:177px;height:223px}
    .art{position:absolute;left:-4px;top:-44px;width:293px;height:237px}
    .art .van{position:absolute;left:44px;top:73px;width:245px;height:164px;object-fit:fill}
    .art .plant{position:absolute;left:0;top:82px;width:72px;height:137px;object-fit:fill}
    .art .bag{position:absolute;left:39px;top:168px;width:57px;height:64px;object-fit:fill}
    .art-shadow-main{position:absolute;left:7px;top:70px;width:148px;height:148px}
    .art-shadow-plant-large{position:absolute;left:-29px;top:126px;width:97px;height:114px;transform:rotate(-6.57deg)}
    .art-shadow-plant-small{position:absolute;left:-18px;top:99px;width:86px;height:99px;transform:rotate(-6.57deg)}
    .promo-badge{position:absolute;left:42px;top:77px;width:47px;height:47px}
    .promo-badge img{width:47px;height:47px;display:block}
    .metrics{position:absolute;z-index:3;left:12px;right:12px;top:172px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
    .metric{position:relative;height:80px;background:#fff;border-radius:16px;padding:10px 12px 12px}
    .metric strong{display:block;font-size:18px;line-height:22px;margin-bottom:4px}
    .metric span{display:block;font-size:13px;line-height:16px;color:var(--secondary)}
    .help{position:absolute;right:0;top:0;width:28px;height:28px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;padding:0}
    .help img{width:16px;height:16px}
    .auto-row{position:absolute;z-index:3;left:12px;right:12px;bottom:12px;height:42px;border-radius:16px;background:#fff;display:flex;align-items:center;padding:0 12px 0 14px;gap:8px}
    .auto-row>span{font-size:13px;line-height:16px}
    .auto-row .help{position:static;margin-left:auto}
    .switch{width:40px;height:34px;margin-left:-4px;border:0;background:transparent;display:grid;place-items:center;padding:0;cursor:pointer;flex:none}
    .switch img{width:32px;height:18px}
    .tabs{position:sticky;top:0;z-index:8;height:52px;background:#fff;padding:16px 16px 0;border-bottom:2px solid var(--line);display:flex;gap:12px}
    .tab{height:36px;border:0;background:none;padding:0 0 12px;font-size:18px;font-weight:800;color:var(--secondary);cursor:pointer}
    .tab.active{color:#111;border-bottom:3px solid #111}
    .tab small{font-size:13px;margin-left:4px;color:var(--secondary);vertical-align:top}
    .catalog{padding:0 16px}
    .category{padding-top:10px}
    .category-title{height:45px;display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800}
    .check{width:21px;height:21px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
    .check img{width:21px;height:21px;display:block}
    .product{position:relative;display:grid;grid-template-columns:80px 1fr;gap:12px;min-height:100px;padding:10px 0;cursor:pointer}
    .product-image{width:80px;height:80px;border-radius:12px;object-fit:cover;background:#f2f1f0}
    .product-check{position:absolute;top:8px;left:-2px;z-index:2;width:22px;height:22px;background:#fff;border-radius:6px 0 6px 0;box-shadow:0 0 0 2px #fff;display:grid;place-items:start;overflow:hidden}
    .product-body{padding-top:1px;min-width:0}
    .product-price{display:flex;align-items:center;gap:5px;min-height:24px;font-size:16px;font-weight:800;white-space:nowrap}
    .product-title{font-size:15px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .discount-badge{display:inline-flex;align-items:center;height:24px;border-radius:12px;background:var(--control);padding:0 8px;font-size:11px;font-weight:400}
    .discount-badge img{width:16px;height:16px;margin-right:3px}
    .empty{padding:40px 16px;text-align:center;color:var(--secondary)}
    .selection{position:absolute;z-index:20;left:0;right:0;bottom:0;display:none;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
    .selection.visible{display:flex}
    .count-pill{pointer-events:auto;height:42px;border-radius:32px;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.13);display:flex;align-items:center;gap:7px;padding:0 14px;font-size:13px}
    .calculator{width:100%;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.12);padding:12px 10px 14px;pointer-events:auto}
    .options{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
    .chip{min-height:36px;border:0;border-radius:12px;background:var(--control);padding:7px 12px;font-size:13px;line-height:16px;white-space:nowrap;cursor:pointer}
    .chip.active{box-shadow:inset 0 0 0 2px #111;background:var(--control)}
    .edit-chip{width:36px;padding:0;flex:none;display:grid;place-items:center}
    .edit-chip img{width:14px;height:16px}
    .range-choice{flex:1;text-align:left;display:flex;flex-direction:column;min-height:56px;justify-content:center}
    .range-choice strong{font-size:14px;line-height:17px}
    .primary{width:100%;height:52px;border:0;border-radius:16px;background:#111;color:#fff;font-size:15px;margin-top:12px;cursor:pointer}
    .caption{text-align:center;font-size:13px;line-height:16px;margin:12px 0 0}
    .caption .info-dot{display:inline-grid;place-items:center;width:20px;height:20px;border:0;background:transparent;margin:-2px 0 -2px -1px;padding:0;cursor:pointer;vertical-align:middle}
    .caption .info-dot img{width:12px;height:16px}
    .backdrop{position:absolute;z-index:40;inset:0;background:rgba(0,0,0,.32);display:none;align-items:flex-end}
    .backdrop.visible{display:flex}
    .sheet{width:100%;max-height:calc(100% - 20px);background:#fff;border-radius:32px 32px 0 0;padding:38px 16px calc(18px + env(safe-area-inset-bottom));position:relative;overflow:hidden;overscroll-behavior:contain}
    .sheet::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:39px;height:4px;border-radius:3px;background:#d3d3d3}
    .sheet.auto-sheet{height:auto;max-height:calc(100% - 20px);padding-bottom:0;overflow-y:auto}
    .sheet.info-sheet{height:650px}
    .sheet.custom-sheet{height:139px;border-radius:24px 24px 0 0;padding:16px 10px 14px;overflow:visible}
    .sheet.custom-sheet::before{display:none}
    .close{position:absolute;right:4px;top:5px;width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;padding:0;cursor:pointer}
    .close img{width:20px;height:29px}
    .sheet h2{font-size:24px;line-height:28px;margin:0 44px 8px 0;letter-spacing:0}
    .sheet p{font-size:15px;line-height:20px;margin:0}
    .sheet-label{display:block;font-size:16px;line-height:20px;font-weight:700;margin:24px 0 10px}
    .segmented{display:grid;grid-template-columns:1fr 1fr;gap:5px}
    .segment{height:44px;border:0;border-radius:12px;background:var(--control);font-size:15px;line-height:20px;cursor:pointer}
    .segment.active{background:#111;color:#fff}
    .result-card{border-radius:16px;background:#f3f3f3;padding:20px 12px 24px;text-align:center}
    .result-card strong{display:block;font-size:24px;line-height:28px;margin-bottom:8px}
    .result-card span{display:block;font-size:13px;line-height:16px}
    .chips-row{display:flex;gap:5px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
    .chips-row .chip.active{background:var(--control)}
    .auto-sheet>.segmented{margin-top:20px}
    .auto-sheet h2{margin-right:0}
    .auto-sheet>.result-card{margin-top:17px}
    .auto-sheet>.price-label{margin-top:15px}
    .calculation-copy{margin-top:24px}
    .calculation-copy strong{display:block;font-size:16px;line-height:20px;margin-bottom:8px}
    .calculation-copy p{font-size:15px;line-height:20px}
    .info-sheet>.price-label{margin-top:24px}
    .info-sheet>.discount-label{margin-top:24px}
    .info-result{padding:12px 12px 24px}
    .info-result .segmented{margin-bottom:22px}
    .info-result .segment{height:36px;font-size:13px;line-height:16px}
    .sheet-footer{position:sticky;bottom:0;height:72px;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.12);padding:10px;margin:24px -16px 0}
    .sheet-footer .primary{margin:0}
    .custom-value{position:absolute;left:50%;top:-57px;transform:translateX(-50%);height:42px;display:flex;align-items:center;text-align:center;font-size:13px;line-height:16px;background:#111;color:#fff;border-radius:32px;padding:0 14px;width:max-content}
    .amount-input{position:fixed;left:-100vw;bottom:0;width:1px;height:1px;opacity:0}
    .slider{width:343px;height:16px;appearance:none;background:linear-gradient(to right,#000 0 var(--progress),#d8d8d8 var(--progress) 100%) center/100% 2px no-repeat;margin:0 6px 0}
    .slider::-webkit-slider-runnable-track{height:2px;background:transparent;border-radius:32px}
    .slider::-webkit-slider-thumb{appearance:none;width:16px;height:16px;border-radius:50%;background:#000;margin-top:-7px}
    .slider::-moz-range-track{height:2px;background:#d8d8d8;border-radius:32px}
    .slider::-moz-range-progress{height:2px;background:#000}
    .slider::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#000}
    .slider-limits{display:flex;justify-content:space-between;color:var(--secondary);font-size:13px}
    .toast{position:absolute;z-index:60;left:16px;right:16px;bottom:18px;background:#222;color:#fff;border-radius:14px;padding:14px 16px;text-align:center;font-size:14px;opacity:0;transform:translateY(20px);pointer-events:none;transition:.2s}
    .toast.visible{opacity:1;transform:none}
    .select-all-footer{position:absolute;z-index:10;left:0;right:0;bottom:0;height:50px;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 16px);display:flex;justify-content:center;align-items:flex-start;pointer-events:none}
    .select-all-footer.hidden{display:none}
    .select-all-pill{pointer-events:auto;height:42px;margin-top:0;border:0;border-radius:32px;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.05);display:flex;align-items:center;gap:6px;padding:0 14px 0 12px;font-size:13px;line-height:16px;cursor:pointer}
    .select-all-pill img{width:21px;height:21px}
    .custom-sheet .slider-limits{padding:0 6px;margin-top:1px}
    .custom-sheet .primary{height:52px;margin-top:16px;background:var(--control);color:#111}
    .viewer-shell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;--device-scale:1}
    .variant-toggle{width:min(calc(100vw - 16px),375px);height:44px;padding:2px;border-radius:13px;background:#e8e8e8;display:grid;grid-template-columns:1fr 1fr;flex:none}
    .variant-button{border:0;border-radius:11px;background:transparent;font-size:14px;line-height:18px;cursor:pointer}
    .variant-button.active{background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.14);font-weight:600}
    .phone .device-wrap{width:calc(375px * var(--device-scale));height:calc(812px * var(--device-scale))}
    .phone .device{inset:auto;left:0;top:0;width:375px;height:812px;display:flex;flex-direction:column;overflow:hidden;transform:scale(var(--device-scale));transform-origin:0 0}
    .phone .app{width:375px;height:734px;max-height:none}
    .system-status{height:44px;display:flex;padding:0;overflow:hidden}
    .system-status img{display:block;width:375px;height:44px;object-fit:cover}
    .system-home{height:34px;display:flex;align-items:center;justify-content:center}
    .system-home::after{content:"";width:134px;height:5px;border-radius:5px;background:#111}
    .prototype-stage{height:734px;flex:none}
    .desktop .system-status{padding:0}
    .desktop .system-home{display:flex}
    .hero{height:310px}
    .metrics.metrics-data{grid-template-columns:1fr 1fr 80px}
    .metrics-data .metric{padding:10px;height:80px}
    .metrics-data .metric strong{display:flex;align-items:center;gap:5px;font-size:18px}
    .metrics-data .metric strong img{width:20px;height:20px}
    .metrics-data .metric span{font-size:12px;line-height:15px}
    .metric-action{border:0;cursor:pointer;text-align:left}
    .metric-action img{display:block;width:15px;height:15px;margin-bottom:8px}
    .auto-arrow{width:32px;height:32px;margin-left:auto;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;padding:0}
    .auto-arrow img{width:20px;height:20px}
    .product{transition:opacity .22s ease,transform .22s ease,max-height .22s ease,min-height .22s ease,padding .22s ease}
    .product.removing{opacity:0;transform:translateX(18px)}
    .calculator{padding:0 10px 14px;overflow:hidden}
    .calculator-status{height:28px;margin:0 -10px 10px;display:flex;align-items:center;justify-content:center;background:#ececec;font-size:12px;line-height:16px;color:#5c5c5c}
    .calculator-status.ai{background:linear-gradient(90deg,#ffe3ee,#e7dcff);color:#5b2c67}
    .calculator-status.great{background:#dcf8d0;color:#346221}
    .options{padding:0 1px}
    .choice-chip{min-width:max-content}
    .choice-chip.ai-choice::before{content:"✦";margin-right:4px;color:#7b48d8}
    .sheet.auto-sheet{height:642px;max-height:calc(100% - 20px)}
    .auto-sheet>.result-card{margin-top:24px}
    .auto-sheet .details-link{display:inline-block;margin-top:8px;color:#111;text-decoration:underline;text-underline-offset:2px}
    .sheet.metrics-sheet{height:642px;padding-top:38px;overflow-y:auto}
    .metrics-summary{margin-top:20px;border-radius:20px;padding:20px 16px 16px;background:linear-gradient(145deg,#f8ddff,#e7f0ff)}
    .metrics-summary>strong{font-size:32px;line-height:36px;display:block;margin-bottom:4px}
    .metrics-summary>p{font-size:14px;line-height:18px;margin-bottom:16px}
    .metrics-growth{background:#fff;border-radius:14px;padding:12px;display:grid;gap:10px}
    .growth-row{display:flex;align-items:center;gap:8px}
    .growth-row img{width:20px;height:20px}
    .growth-row strong{font-size:16px;line-height:20px;min-width:48px}
    .growth-row span{font-size:13px;line-height:16px;color:var(--secondary)}
    .metrics-explanation{margin-top:24px}
    .metrics-explanation h3{font-size:20px;line-height:24px;margin:0 0 14px}
    .metrics-step{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;margin:0 0 12px}
    .metrics-step-visual{width:48px;height:48px;border-radius:14px;background:var(--control)}
    .metrics-step p{font-size:14px;line-height:18px}
    .sheet.custom-sheet{height:248px;border-radius:24px 24px 0 0;padding:16px 10px 14px}
    .manual-input-wrap{height:48px;border-radius:14px;background:var(--control);display:flex;align-items:center;padding:0 12px;margin-bottom:18px}
    .amount-input{position:static;width:100%;height:100%;opacity:1;border:0;background:transparent;font-size:20px;line-height:24px;font-weight:700;outline:0}
    .amount-input::-webkit-inner-spin-button{display:none}
    .clear-amount{width:28px;height:28px;border:0;border-radius:50%;background:#d5d5d5;display:grid;place-items:center;font-size:18px;cursor:pointer}
    .custom-sheet .slider{width:calc(100% - 12px)}
    .custom-sheet .primary{background:#111;color:#fff;margin-top:18px}
    .custom-value{display:none}
    @media (max-height:680px){.variant-toggle{height:38px}.viewer-shell{gap:6px}}
    @media (min-width:376px){.phone .app{box-shadow:none}}
    @media (max-width:560px){
      .boot,.viewer-choice{padding:0;background:#fff}
      .boot-card,.viewer-choice-card{width:100%;min-height:100%;border-radius:0;padding:28px 20px;box-shadow:none;display:flex;flex-direction:column;justify-content:center}
      .viewer-choice-card h1{font-size:28px;line-height:32px}
      .viewer-options{grid-template-columns:1fr;gap:10px}
      .viewer-option{min-height:112px;display:grid;grid-template-columns:96px 1fr;grid-template-rows:auto auto;column-gap:12px;align-content:center}
      .viewer-option-preview{grid-row:1/3;margin:0}
      .viewer-option strong{align-self:end}
      .viewer-option span{align-self:start}
    }
  </style>
</head>
<body>
  <section class="boot" id="boot" aria-live="polite">
    <div class="boot-card">
      <p class="boot-title" id="bootTitle">Загружаем прототип</p>
      <p class="boot-copy" id="bootCopy">Подготавливаем изображения и шрифты</p>
      <div class="boot-progress"><div class="boot-progress-bar" id="bootProgress"></div></div>
      <button class="boot-retry" id="bootRetry">Повторить</button>
    </div>
  </section>
  <section class="viewer-choice" id="viewerChoice" hidden>
    <div class="viewer-choice-card">
      <h1>Как открыть прототип?</h1>
      <p>Выберите удобный режим просмотра</p>
      <div class="viewer-options">
        <button class="viewer-option" data-viewer="phone">
          <span class="viewer-option-preview phone-preview" aria-hidden="true">FULL</span>
          <strong>На телефоне</strong>
          <span>Открыть на весь экран</span>
        </button>
        <button class="viewer-option" data-viewer="desktop">
          <span class="viewer-option-preview desktop-preview" aria-hidden="true">375 × 812</span>
          <strong>На компьютере</strong>
          <span>Показать в рамке смартфона</span>
        </button>
      </div>
    </div>
  </section>
  <div class="viewer-shell" id="viewerShell" hidden inert aria-hidden="true">
    <div class="variant-toggle" id="variantToggle" aria-label="Вариант прототипа">
      <button class="variant-button active" data-metrics="false">Без метрик</button>
      <button class="variant-button" data-metrics="true">С метриками</button>
    </div>
    <div class="device-wrap">
      <div class="device">
        <div class="system-status" aria-hidden="true"><img src="./assets/status-bar.png" alt=""></div>
        <div class="prototype-stage">
  <main class="app" id="app">
    <header class="sticky-header" id="stickyHeader">
      <button class="back" aria-label="Назад"><img src="./assets/icon3.svg" alt=""></button>
      <div class="sticky-title">Скидка на доставку</div>
    </header>
    <div class="scroll" id="scroll">
      <section class="hero">
        <div class="hero-background"></div>
        <button class="back" aria-label="Назад"><img src="./assets/icon3.svg" alt=""></button>
        <div class="hero-copy"><h1>Скидка<br>на доставку</h1><p>Чтобы сделать товары привлекательнее</p></div>
        <div class="art-viewport" aria-hidden="true"><div class="art"><img class="art-shadow-main" src="./assets/ellipse3438.svg"><img class="art-shadow-plant-large" src="./assets/ellipse29603.svg"><img class="art-shadow-plant-small" src="./assets/ellipse29604.svg"><img class="van" src="./assets/van-cat-green.png"><img class="plant" src="./assets/plant-box.png"><img class="bag" src="./assets/shopping-bag.png"><div class="promo-badge"><img src="./assets/promo-badge.svg"></div></div></div>
        <div class="metrics" id="heroMetrics"></div>
        <div class="auto-row"><button class="switch" id="autoSwitch" role="switch" aria-checked="false"><img src="./assets/switch-inactive.svg" alt=""></button><span>Включать на новые товары</span><button class="auto-arrow" data-sheet="auto" aria-label="Настроить"><img src="./assets/arrow-forward.svg" alt=""></button></div>
      </section>
      <nav class="tabs"><button class="tab active" data-tab="eligible">Подходят<small>40</small></button><button class="tab" data-tab="discounted">Со скидкой<small id="discountedCount">1</small></button></nav>
      <section class="catalog" id="catalog"></section>
    </div>
    <section class="select-all-footer" id="selectAllFooter">
      <button class="select-all-pill" id="selectAll"><img src="./assets/checkbox-inactive.svg" alt=""><span>Выбрать все товары</span></button>
    </section>
    <section class="selection" id="selection">
      <div class="count-pill"><button class="check active" id="clearSelection" aria-label="Снять выбор"><img src="./assets/checkbox-active.svg" alt=""></button><span id="selectionCount"></span></div>
      <div class="calculator"><div class="calculator-status" id="calculatorStatus"></div><div class="options" id="selectionOptions"></div><button class="primary" id="applyDiscount">Применить</button><p class="caption">Считаем скидки индивидуально <button class="info-dot" data-sheet="info" aria-label="Подробнее"><img src="./assets/icon.svg" alt=""></button></p></div>
    </section>
    <div class="backdrop" id="backdrop"><section class="sheet" id="sheet"></section></div>
    <div class="toast" id="toast"></div>
  </main>
        </div>
        <div class="system-home" aria-hidden="true"></div>
      </div>
    </div>
  </div>
  <script>
    const categories=[
      {name:'Обувь',items:[
        {id:'salomon',price:1000,title:'Кроссовки Salomon',image:'./assets/product-salomon.png'},
        {id:'diesel',price:5000,title:'Ботинки Diesel',image:'./assets/product-diesel.png'}]},
      {name:'Постельное бельё',items:[
        {id:'turquoise',price:2000,title:'Постельное бельё ИКЕА Бирюза',image:'./assets/image1.png'},
        {id:'ocean',price:3000,title:'Постельное бельё ИКЕА Океан',image:'./assets/product-bedding-turquoise.png'},
        {id:'rose',price:5000,title:'Постельное бельё ИКЕА Роза',image:'./assets/product-bedding-ocean.png'},
        {id:'carrots',price:2000,title:'Постельное бельё ИКЕА Морковки',image:'./assets/product-bedding-carrots.png'}]},
      {name:'Светильники',items:[
        {id:'lamp-round',price:1000,title:'Светильник круглый',image:'./assets/product-lamp-round.png'},
        {id:'lamp-kitchen',price:3000,title:'Светильник для кухни',image:'./assets/product-lamp-kitchen.png'},
        {id:'lamp-tall',price:4000,title:'Светильник высокий туба',image:'./assets/product-lamp-tall.png'}]}
    ];
    const oakley={id:'oakley',price:3000,title:'Кроссовки Oakley',image:'./assets/product-oakley.png'};
    const allItems=categories.flatMap(category=>category.items);
    const state={tab:'eligible',selected:new Set(),applied:new Map([[oakley.id,300]]),selectionLevel:'ai',manualRatio:null,auto:false,priceBand:0,metrics:false};
    const rubles=value=>new Intl.NumberFormat('ru-RU').format(value)+' ₽';
    const roundHundred=value=>Math.round(value/100)*100;
    const minimumDiscount=price=>roundHundred(price*.1);
    const discount=(price,level)=>{
      const minimum=minimumDiscount(price);
      if(level==='minimum')return minimum;
      const ai=Math.max(minimum+100,roundHundred(price*.15));
      if(level==='ai')return ai;
      const great=Math.max(ai+100,roundHundred(price*.2));
      if(level==='great')return great;
      return Math.max(great+100,Math.floor(price*.25/100)*100);
    };
    const maximumDiscount=price=>minimumDiscount(price)*5;
    const eligibleItems=()=>allItems.filter(item=>!state.applied.has(item.id));
    const selectedItems=()=>eligibleItems().filter(item=>state.selected.has(item.id));
    const productWord=count=>count%10===1&&count%100!==11?'товар':count%10>=2&&count%10<=4&&(count%100<12||count%100>14)?'товара':'товаров';
    const rangeLabel=(items,level)=>{
      const values=items.map(item=>discount(item.price,level));
      if(!values.length)return '0 ₽';
      const minimum=Math.min(...values);
      const maximum=Math.max(...values);
      return minimum===maximum?rubles(minimum):rubles(minimum).replace(' ₽','')+'–'+rubles(maximum);
    };
    const catalog=document.getElementById('catalog');
    const app=document.getElementById('app');
    const scroll=document.getElementById('scroll');
    const stickyHeader=document.getElementById('stickyHeader');
    const selectAllFooter=document.getElementById('selectAllFooter');
    const selection=document.getElementById('selection');
    const selectionCount=document.getElementById('selectionCount');
    const selectionOptions=document.getElementById('selectionOptions');
    const calculatorStatus=document.getElementById('calculatorStatus');
    const discountedCount=document.getElementById('discountedCount');
    const backdrop=document.getElementById('backdrop');
    const sheet=document.getElementById('sheet');
    const toast=document.getElementById('toast');
    const boot=document.getElementById('boot');
    const bootTitle=document.getElementById('bootTitle');
    const bootCopy=document.getElementById('bootCopy');
    const bootProgress=document.getElementById('bootProgress');
    const bootRetry=document.getElementById('bootRetry');
    const viewerChoice=document.getElementById('viewerChoice');
    const viewerShell=document.getElementById('viewerShell');
    const variantToggle=document.getElementById('variantToggle');
    const heroMetrics=document.getElementById('heroMetrics');
    const imageAssets=[
      './assets/arrow-forward.svg','./assets/checkbox-active.svg','./assets/checkbox-inactive.svg',
      './assets/close.svg','./assets/ellipse29603.svg','./assets/ellipse29604.svg',
      './assets/ellipse3438.svg','./assets/help.svg','./assets/help1.svg','./assets/icon.svg',
      './assets/icon2.svg','./assets/icon3.svg','./assets/icon4.svg','./assets/image1.png',
      './assets/metrics-action.png','./assets/metrics-eye.png','./assets/metrics-heart.png',
      './assets/plant-box.png','./assets/product-bedding-carrots.png',
      './assets/product-bedding-ocean.png','./assets/product-bedding-turquoise.png',
      './assets/product-diesel.png','./assets/product-lamp-kitchen.png',
      './assets/product-lamp-round.png','./assets/product-lamp-tall.png',
      './assets/product-oakley.png','./assets/product-salomon.png','./assets/promo-badge.svg',
      './assets/shopping-bag.png','./assets/status-bar.png','./assets/switch-active.svg',
      './assets/switch-inactive.svg','./assets/van-cat-green.png'
    ];
    const fontAssets=[
      {url:'./assets/avito-sans-text-regular.woff2',weight:400},
      {url:'./assets/avito-sans-text-medium.woff2',weight:500},
      {url:'./assets/avito-sans-text-semibold.woff2',weight:600},
      {url:'./assets/avito-sans-text-bold.woff2',weight:700},
      {url:'./assets/avito-sans-text-extrabold.woff2',weight:800}
    ];
    const preparedResources=new Set();
    const warmedImages=[];

    function checkButton(active,label){
      return '<button class="check '+(active?'active':'')+'" aria-label="'+label+'"><img src="./assets/checkbox-'+(active?'active':'inactive')+'.svg" alt=""></button>';
    }

    function selectedDiscount(item){
      if(!state.selected.has(item.id))return null;
      if(state.manualRatio!==null){
        const value=roundHundred(item.price*state.manualRatio);
        return Math.min(maximumDiscount(item.price),Math.max(minimumDiscount(item.price),value));
      }
      return discount(item.price,state.selectionLevel);
    }

    function productMarkup(item,selected,applied){
      const badge=applied??selectedDiscount(item);
      return '<article class="product" data-id="'+item.id+'"><img class="product-image" src="'+item.image+'" alt=""><span class="product-check">'+checkButton(selected,selected?'Снять выбор':'Выбрать товар')+'</span><div class="product-body"><div class="product-price">'+rubles(item.price)+(badge?'<span class="discount-badge"><img src="./assets/icon2.svg" alt="">Скидка '+rubles(badge)+'</span>':'')+'</div><div class="product-title">'+item.title+'</div></div></article>';
    }

    function discountedMarkup(){
      return categories.map(category=>{
        const items=category.name==='Обувь'
          ?[oakley,...category.items.filter(item=>state.applied.has(item.id))]
          :category.items.filter(item=>state.applied.has(item.id));
        if(!items.length)return '';
        return '<div class="category"><div class="category-title">'+category.name+'</div>'+items.map(item=>productMarkup(item,false,state.applied.get(item.id))).join('')+'</div>';
      }).join('')||'<div class="empty">Здесь появятся товары со скидкой</div>';
    }

    function renderCatalog(){
      discountedCount.textContent=state.applied.size;
      document.querySelectorAll('.tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.tab===state.tab));
      if(state.tab==='discounted'){
        catalog.innerHTML=discountedMarkup();
        selection.classList.remove('visible');
        app.classList.remove('has-selection');
        selectAllFooter.classList.add('hidden');
        return;
      }
      catalog.innerHTML=categories.map(category=>{
        const items=category.items.filter(item=>!state.applied.has(item.id));
        if(!items.length)return '';
        const chosen=items.every(item=>state.selected.has(item.id));
        return '<div class="category"><div class="category-title" data-category="'+category.name+'">'+checkButton(chosen,chosen?'Снять выбор с категории':'Выбрать категорию')+'<span>'+category.name+'</span></div>'+items.map(item=>productMarkup(item,state.selected.has(item.id),null)).join('')+'</div>';
      }).join('');
      renderSelection();
    }

    function renderCalculatorStatus(){
      calculatorStatus.className='calculator-status';
      if(state.selectionLevel==='ai'&&state.manualRatio===null){
        calculatorStatus.classList.add('ai');
        calculatorStatus.textContent='Скидку рекомендует нейросеть ⓘ';
        return;
      }
      if(state.selectionLevel==='minimum'&&state.manualRatio===null){
        calculatorStatus.textContent='Нормальная скидка';
        return;
      }
      calculatorStatus.classList.add('great');
      calculatorStatus.textContent='Отличная скидка!';
    }

    function renderSelection(){
      const items=selectedItems();
      selection.classList.toggle('visible',items.length>0);
      app.classList.toggle('has-selection',items.length>0);
      selectAllFooter.classList.toggle('hidden',items.length>0||state.tab!=='eligible');
      if(!items.length)return;
      selectionCount.textContent=items.length+' '+productWord(items.length);
      renderCalculatorStatus();
      const levels=[
        {key:'minimum',ai:false},
        {key:'ai',ai:true},
        {key:'great',ai:false},
        {key:'strong',ai:false}
      ];
      selectionOptions.innerHTML=levels.map(level=>{
        const active=state.manualRatio===null&&state.selectionLevel===level.key;
        const label=rangeLabel(items,level.key);
        return '<button class="chip choice-chip '+(level.ai?'ai-choice ':'')+(active?'active':'')+'" data-level="'+level.key+'">'+label+'</button>';
      }).join('')+'<button class="chip edit-chip '+(state.manualRatio!==null?'active':'')+'" data-sheet="custom" aria-label="Задать свою скидку"><img src="./assets/icon4.svg" alt=""></button>';
    }

    function renderHeroMetrics(){
      heroMetrics.classList.toggle('metrics-data',state.metrics);
      if(state.metrics){
        heroMetrics.innerHTML='<div class="metric"><strong>+86 <img src="./assets/metrics-heart.png" alt=""></strong><span>Добавлений в избранное</span></div><div class="metric"><strong>+120 <img src="./assets/metrics-eye.png" alt=""></strong><span>Количество просмотров</span></div><button class="metric metric-action" data-sheet="metrics"><img src="./assets/metrics-action.png" alt=""><span>Как мы это считаем</span></button>';
      }else{
        heroMetrics.innerHTML='<div class="metric"><strong>x2,5</strong><span>Растет скорость продажи</span></div><div class="metric"><strong>x3</strong><span>Растёт количество покупателей</span></div>';
      }
      variantToggle.querySelectorAll('[data-metrics]').forEach(button=>button.classList.toggle('active',(button.dataset.metrics==='true')===state.metrics));
    }

    function showToast(message){
      toast.textContent=message;
      toast.classList.add('visible');
      setTimeout(()=>toast.classList.remove('visible'),2200);
    }

    function resetPrototype(){
      state.tab='eligible';
      state.selected.clear();
      state.applied.clear();
      state.applied.set(oakley.id,300);
      state.selectionLevel='ai';
      state.manualRatio=null;
      state.auto=false;
      state.priceBand=0;
      state.metrics=false;
      scroll.scrollTop=0;
      stickyHeader.classList.remove('visible');
      backdrop.classList.remove('visible');
      sheet.innerHTML='';
      toast.classList.remove('visible');
      const control=document.getElementById('autoSwitch');
      control.classList.remove('active');
      control.setAttribute('aria-checked','false');
      control.querySelector('img').src='./assets/switch-inactive.svg';
      renderHeroMetrics();
      renderCatalog();
    }

    function loadImage(url){
      return new Promise((resolve,reject)=>{
        const image=new Image();
        const timeout=setTimeout(()=>reject(new Error('Таймаут загрузки '+url)),20000);
        image.onload=async()=>{
          try{
            if(image.decode)await image.decode();
            clearTimeout(timeout);
            warmedImages.push(image);
            resolve();
          }catch(error){
            clearTimeout(timeout);
            reject(error);
          }
        };
        image.onerror=()=>{
          clearTimeout(timeout);
          reject(new Error('Не удалось загрузить '+url));
        };
        image.src=url;
      });
    }

    async function loadFont(font){
      const response=await fetch(font.url,{cache:'force-cache'});
      if(!response.ok)throw new Error('Не удалось загрузить '+font.url);
      await response.arrayBuffer();
      const faces=await document.fonts.load(font.weight+' 16px "Avito Sans Text"');
      if(!faces.length)throw new Error('Не удалось подготовить '+font.url);
    }

    async function loadRequiredResources(){
      boot.classList.remove('error');
      bootTitle.textContent='Загружаем прототип';
      bootCopy.textContent='Подготавливаем изображения и шрифты';
      const resources=[
        ...imageAssets.map(url=>({key:url,load:()=>loadImage(url)})),
        ...fontAssets.map(font=>({key:font.url,load:()=>loadFont(font)}))
      ];
      const updateProgress=()=>{
        bootProgress.style.width=Math.round(preparedResources.size/resources.length*100)+'%';
      };
      updateProgress();
      try{
        const pending=resources.filter(resource=>!preparedResources.has(resource.key));
        await Promise.all(pending.map(async resource=>{
          await resource.load();
          preparedResources.add(resource.key);
          updateProgress();
        }));
        await document.fonts.ready;
        resetPrototype();
        await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
        const directMode=new URLSearchParams(location.search).get('viewer');
        if(directMode==='phone'||directMode==='desktop')startViewer(directMode);
        else showViewerChoice();
      }catch(error){
        console.error(error);
        boot.classList.add('error');
        bootTitle.textContent='Не удалось загрузить прототип';
        bootCopy.textContent='Проверьте соединение и попробуйте ещё раз';
      }
    }

    function showViewerChoice(){
      boot.hidden=true;
      viewerChoice.hidden=false;
    }

    function startViewer(mode){
      resetPrototype();
      viewerChoice.hidden=true;
      boot.hidden=true;
      viewerShell.className='viewer-shell '+mode;
      viewerShell.hidden=false;
      viewerShell.inert=false;
      viewerShell.setAttribute('aria-hidden','false');
      updateDeviceScale();
    }

    function updateDeviceScale(){
      if(viewerShell.hidden)return;
      const desktop=viewerShell.classList.contains('desktop');
      const width=desktop?395:375;
      const height=desktop?832:812;
      const horizontalMargin=desktop?32:8;
      const verticalSpace=64;
      const scale=Math.min(1,(window.innerWidth-horizontalMargin)/width,(window.innerHeight-verticalSpace)/height);
      viewerShell.style.setProperty('--device-scale',Math.max(.2,scale));
    }

    function openSheet(type){
      if(type==='auto')renderRateSheet(true);
      if(type==='info')renderRateSheet(false);
      if(type==='custom')renderCustomSheet();
      if(type==='metrics')renderMetricsSheet();
      backdrop.classList.add('visible');
      if(type==='custom'){
        setTimeout(()=>{
          const input=document.getElementById('amountInput');
          input?.focus({preventScroll:true});
          input?.select();
        },50);
      }
    }

    function bands(){
      return[
        {label:'До 1 000 ₽',max:1000},
        {label:'1 000–3 000 ₽',max:3000},
        {label:'3 000–6 000 ₽',max:6000},
        {label:'6 000–10 000 ₽',max:10000},
        {label:'10 000–20 000 ₽',max:20000}
      ];
    }

    function renderRateSheet(auto){
      const band=bands()[state.priceBand];
      const value=minimumDiscount(band.max);
      sheet.className='sheet '+(auto?'auto-sheet':'info-sheet');
      const close='<button class="close" aria-label="Закрыть"><img src="./assets/close.svg" alt=""></button>';
      const priceBands='<span class="sheet-label price-label">Если цена товара</span><div class="chips-row">'+bands().map((item,index)=>'<button class="chip '+(state.priceBand===index?'active':'')+'" data-band="'+index+'" data-auto="'+auto+'">'+item.label+'</button>').join('')+'</div>';
      if(auto){
        sheet.innerHTML=close+'<h2>Включать новым товарам<br>скидку на доставку</h2><p>Будем автоматически подключать новым объявлениям скидку:</p><div class="result-card"><strong>До '+rubles(value)+'</strong><span>Скидка на доставку, которую установим для нового объявления</span></div>'+priceBands+'<div class="calculation-copy"><strong>Как рассчитывается скидка</strong><p>Скидка зависит от стоимости доставки, которая в свою очередь зависит от стоимости и габаритов товара</p><a class="details-link" href="#" data-details>Подробнее</a></div><div class="sheet-footer"><button class="primary" id="enableAuto">Включать новым товарам</button></div>';
      }else{
        sheet.innerHTML=close+'<h2>Как мы считаем<br>скидку для товара</h2><p>Минимальная скидка составляет 100 ₽ на каждую 1 000 ₽ цены товара. Нейросеть предлагает усиленный вариант с учётом стоимости товара.</p>'+priceBands+'<span class="sheet-label discount-label">Скидка на доставку</span><div class="result-card info-result"><strong>От '+rubles(value)+'</strong><span>Максимум для ручной настройки — '+rubles(value*5)+'</span></div>';
      }
    }

    function renderMetricsSheet(){
      sheet.className='sheet metrics-sheet';
      sheet.innerHTML='<button class="close" aria-label="Закрыть"><img src="./assets/close.svg" alt=""></button><h2>Данные о скидках</h2><div class="metrics-summary"><strong>287</strong><p>Товаров подключались к скидке на доставку за период 29 июля – 28 августа</p><div class="metrics-growth"><div class="growth-row"><img src="./assets/metrics-eye.png" alt=""><strong>+120</strong><span>Прибавилось просмотров</span></div><div class="growth-row"><img src="./assets/metrics-heart.png" alt=""><strong>+24</strong><span>Выросло добавлений в избранное</span></div></div></div><div class="metrics-explanation"><h3>Как мы считаем показатели?</h3><div class="metrics-step"><span class="metrics-step-visual"></span><p>Считаем количество товаров которым вы подключали скидки</p></div><div class="metrics-step"><span class="metrics-step-visual"></span><p>Отслеживаем прирост просмотров и добавлений в избранное после подключения скидок</p></div><div class="metrics-step"><span class="metrics-step-visual"></span><p>Обновляем данные раз в сутки, суммируя показатели за 30 дней</p></div></div>';
    }

    function renderCustomSheet(){
      const item=selectedItems()[0];
      if(!item)return;
      const minimum=minimumDiscount(item.price);
      const maximum=maximumDiscount(item.price);
      const current=state.manualRatio===null?discount(item.price,state.selectionLevel):roundHundred(item.price*state.manualRatio);
      const value=Math.min(maximum,Math.max(minimum,current));
      state.manualRatio=value/item.price;
      const progress=(value-minimum)/(maximum-minimum)*100;
      sheet.className='sheet custom-sheet';
      sheet.innerHTML='<div class="manual-input-wrap"><input class="amount-input" id="amountInput" type="number" inputmode="numeric" step="100" min="'+minimum+'" max="'+maximum+'" value="'+value+'" aria-label="Размер скидки"><span>₽</span><button class="clear-amount" id="clearAmount" aria-label="Очистить">×</button></div><input class="slider" id="amountSlider" type="range" step="100" min="'+minimum+'" max="'+maximum+'" value="'+value+'" style="--progress:'+progress+'%"><div class="slider-limits"><span>'+rubles(minimum)+'</span><span>'+rubles(maximum)+'</span></div><button class="primary" id="saveCustom">Применить</button>';
    }

    catalog.addEventListener('click',event=>{
      const product=event.target.closest('.product');
      const category=event.target.closest('[data-category]');
      if(product&&state.tab==='eligible'){
        const id=product.dataset.id;
        state.selected.has(id)?state.selected.delete(id):state.selected.add(id);
        state.selectionLevel='ai';
        state.manualRatio=null;
        renderCatalog();
      }else if(category){
        const target=categories.find(item=>item.name===category.dataset.category);
        const items=target.items.filter(item=>!state.applied.has(item.id));
        const allChosen=items.every(item=>state.selected.has(item.id));
        items.forEach(item=>allChosen?state.selected.delete(item.id):state.selected.add(item.id));
        state.selectionLevel='ai';
        state.manualRatio=null;
        renderCatalog();
      }
    });

    document.querySelector('.tabs').addEventListener('click',event=>{
      const tab=event.target.closest('[data-tab]');
      if(!tab)return;
      state.tab=tab.dataset.tab;
      renderCatalog();
    });

    document.getElementById('selectAll').addEventListener('click',()=>{
      eligibleItems().forEach(item=>state.selected.add(item.id));
      state.selectionLevel='ai';
      state.manualRatio=null;
      renderCatalog();
    });

    document.getElementById('clearSelection').addEventListener('click',()=>{
      state.selected.clear();
      renderCatalog();
    });

    scroll.addEventListener('scroll',()=>{
      stickyHeader.classList.toggle('visible',scroll.scrollTop>=262);
    },{passive:true});

    selectionOptions.addEventListener('click',event=>{
      const level=event.target.closest('[data-level]');
      const sheetButton=event.target.closest('[data-sheet]');
      if(level){
        state.selectionLevel=level.dataset.level;
        state.manualRatio=null;
        renderCatalog();
      }
      if(sheetButton)openSheet(sheetButton.dataset.sheet);
    });

    document.getElementById('applyDiscount').addEventListener('click',async()=>{
      const items=selectedItems();
      if(!items.length)return;
      items.forEach(item=>document.querySelector('.product[data-id="'+item.id+'"]')?.classList.add('removing'));
      await new Promise(resolve=>setTimeout(resolve,230));
      items.forEach(item=>{
        const value=state.manualRatio===null?discount(item.price,state.selectionLevel):Math.min(maximumDiscount(item.price),Math.max(minimumDiscount(item.price),roundHundred(item.price*state.manualRatio)));
        state.applied.set(item.id,value);
      });
      state.selected.clear();
      state.manualRatio=null;
      renderCatalog();
      showToast('Скидка применена к '+items.length+' '+(items.length===1?'товару':'товарам'));
    });

    document.getElementById('autoSwitch').addEventListener('click',()=>openSheet('auto'));

    document.addEventListener('click',event=>{
      const trigger=event.target.closest('[data-sheet]');
      if(trigger&&!trigger.closest('#selectionOptions'))openSheet(trigger.dataset.sheet);
    });

    backdrop.addEventListener('click',event=>{
      if(event.target===backdrop||event.target.closest('.close'))backdrop.classList.remove('visible');
    });

    sheet.addEventListener('click',event=>{
      const band=event.target.closest('[data-band]');
      if(band){
        state.priceBand=Number(band.dataset.band);
        renderRateSheet(band.dataset.auto==='true');
      }
      if(event.target.closest('[data-details]'))event.preventDefault();
      if(event.target.id==='enableAuto'){
        state.auto=true;
        const control=document.getElementById('autoSwitch');
        control.classList.add('active');
        control.setAttribute('aria-checked','true');
        control.querySelector('img').src='./assets/switch-active.svg';
        backdrop.classList.remove('visible');
        showToast('Скидка для новых товаров включена');
      }
      if(event.target.id==='clearAmount'){
        const input=document.getElementById('amountInput');
        input.value='';
        input.focus({preventScroll:true});
      }
      if(event.target.id==='saveCustom'){
        const item=selectedItems()[0];
        if(item){
          const minimum=minimumDiscount(item.price);
          const maximum=maximumDiscount(item.price);
          const input=document.getElementById('amountInput');
          state.manualRatio=Math.min(maximum,Math.max(minimum,Number(input.value)||minimum))/item.price;
        }
        backdrop.classList.remove('visible');
        renderCatalog();
      }
    });

    sheet.addEventListener('input',event=>{
      if(!['amountInput','amountSlider'].includes(event.target.id))return;
      const item=selectedItems()[0];
      if(!item)return;
      const minimum=minimumDiscount(item.price);
      const maximum=maximumDiscount(item.price);
      const value=Math.min(maximum,Math.max(minimum,Number(event.target.value)||minimum));
      state.manualRatio=value/item.price;
      const input=document.getElementById('amountInput');
      const slider=document.getElementById('amountSlider');
      if(event.target.id==='amountSlider')input.value=value;
      slider.value=value;
      slider.style.setProperty('--progress',(value-minimum)/(maximum-minimum)*100+'%');
      if(event.target.id==='amountSlider')requestAnimationFrame(()=>input.focus({preventScroll:true}));
    });

    variantToggle.addEventListener('click',event=>{
      const button=event.target.closest('[data-metrics]');
      if(!button)return;
      state.metrics=button.dataset.metrics==='true';
      renderHeroMetrics();
    });

    viewerChoice.addEventListener('click',event=>{
      const option=event.target.closest('[data-viewer]');
      if(option)startViewer(option.dataset.viewer);
    });

    bootRetry.addEventListener('click',loadRequiredResources);
    window.addEventListener('resize',updateDeviceScale,{passive:true});
    loadRequiredResources();
  </script>
</body>
</html>
