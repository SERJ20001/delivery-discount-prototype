    .sheet.auto-sheet{height:473px;max-height:calc(100% - 20px);padding:42px 16px 0;overflow:hidden}
    .auto-sheet h2{margin:0 0 8px}
    .auto-sheet .auto-copy{font-size:15px;line-height:20px}
    .auto-sheet .price-label{margin:20px 0 12px}
    .auto-sheet .auto-result-label{display:block;font-size:18px;line-height:22px;font-weight:700;margin-top:20px}
    .auto-result{height:96px;margin-top:12px;border:2px solid transparent;border-radius:20px;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(110deg,#ff4053,#965eeb) border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
    .auto-result strong{display:flex;align-items:center;gap:4px;font-size:18px;line-height:22px}
    .auto-result strong img{width:12px;height:12px}
    .auto-result span{font-size:11px;line-height:14px;color:var(--secondary)}
    .auto-sheet .sheet-footer{position:absolute;left:0;right:0;bottom:0;height:68px;margin:0;padding:10px;border-radius:24px 24px 0 0}
    .sheet.metrics-sheet{height:642px;padding:32px 16px 24px;overflow-y:auto}
    .metrics-sheet h2{font-size:26px;line-height:30px;margin-bottom:16px}
    .metrics-summary{margin:0 -4px;border-radius:24px;padding:14px 2px 2px;background:radial-gradient(ellipse at 80% 20%,#e0f4ff,transparent 80%),radial-gradient(ellipse at 0 100%,#ffe6e6,transparent 70%),#fcf0fc}
    .metrics-summary>strong{font-size:21px;line-height:26px;display:block;margin:0 16px 6px}
    .metrics-summary>p{font-size:15px;line-height:20px;margin:0 16px 12px}
    .metrics-growth{background:#fff;border-radius:22px;padding:16px;display:grid;gap:16px}
    .growth-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
    .growth-row img{width:20px;height:20px}
    .growth-row strong{font-size:21px;line-height:26px}
    .growth-row span{flex-basis:100%;font-size:15px;line-height:20px;color:var(--secondary)}
    .metrics-explanation{margin-top:32px}
    .metrics-explanation h3{font-size:21px;line-height:26px;margin:0 0 6px}
    .metrics-step{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;padding:11px 0}
    .metrics-step-visual{width:48px;height:48px;border-radius:14px;background:var(--control)}
    .metrics-step p{font-size:15px;line-height:20px}
    .sheet.custom-sheet{height:auto;max-height:100%;border-radius:24px 24px 0 0;padding:0;overflow:hidden}
    .manual-controls{height:167px;position:relative;padding:10px}
    .manual-input-wrap{height:52px;border-radius:16px;background:var(--control);display:flex;align-items:center;gap:6px;padding:0 18px;position:relative;font-size:15px;font-weight:500}
    .amount-input{position:static;width:3ch;max-width:250px;height:100%;padding:0;opacity:1;border:0;background:transparent;font-size:15px;line-height:20px;font-weight:500;outline:0}
    .amount-input::-webkit-inner-spin-button{display:none}
    .clear-amount{position:absolute;right:8px;top:5px;width:30px;height:40px;padding:0;border:0;background:transparent;display:grid;place-items:center;cursor:pointer}
    .clear-amount img{width:14px;height:20px}
    .slider-wrap{position:relative;margin:-9px 24px 0;height:35px}
    .custom-sheet .slider{position:relative;z-index:2;display:block;width:100%;margin:0;height:16px;cursor:pointer}
    .custom-sheet .slider-limits{padding:0;margin:0;line-height:16px}
    .slider::-webkit-slider-thumb{background:transparent url(./assets/slider-thumb.svg) center/16px 16px no-repeat}
    .slider::-moz-range-thumb{background:transparent url(./assets/slider-thumb.svg) center/16px 16px no-repeat}
    .slider-recommendation{position:absolute;inset:0;pointer-events:none}
    .slider-recommendation>img{position:absolute;left:var(--recommendation);top:0;transform:translateX(-50%);width:16px;height:16px}
    .slider-recommendation span{position:absolute;top:16px;left:clamp(58px,var(--recommendation),calc(100% - 60px));transform:translateX(-50%);display:flex;align-items:center;gap:3px;font-size:13px;line-height:16px;color:var(--secondary)}
    .slider-recommendation span img{width:12px;height:16px}
    .slider-product-marker{position:absolute;z-index:4;top:-8px;left:var(--marker);transform:translateX(-50%);display:flex}
    .slider-product-marker[hidden]{display:none}
    .slider-product-marker img{width:24px;height:24px;border:1.5px solid #fff;border-radius:50%;object-fit:cover;background:#fff}
    .custom-sheet .primary{position:absolute;left:10px;right:10px;bottom:13px;width:355px;background:#111;color:#fff;margin:0}
    .custom-value{display:none}
    .numeric-keyboard{height:255px;background:#d4d6dc;padding:6px 6px 41px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,46px);gap:8px 6px}
    .numeric-key{padding:0;border:0;border-radius:5px;background:#fcfcfe;box-shadow:0 1px 0 rgba(0,0,0,.35);font-family:inherit;color:#000;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:25px;line-height:29px}
    .numeric-key small{font-size:10px;line-height:12px;letter-spacing:2px;font-weight:600}
    .numeric-key.delete-key{background:transparent;box-shadow:none}
    .numeric-key img{width:23px;height:17px}
    .numeric-key:active{background:#bcc0c8}
    .device.keyboard-open .system-home{background:#d4d6dc}
    @media (max-height:680px){.variant-toggle{height:38px}.viewer-shell{gap:6px}}
    @media (min-width:376px){.phone .app{box-shadow:none}}
    @media (max-width:560px){
      .boot,.viewer-choice{padding:0;background:#fff}
      .boot-card,.viewer-choice-card{width:100%;min-height:100%;border-radius:0;padding:28px 20px;box-shadow:none;display:flex;flex-direction:column;justify-content:center}
      .viewer-choice-card h1{font-size:28px;line-height:32px}
      .viewer-options{grid-template-columns:1fr;gap:10px}
      .viewer-option{min-height:112px;display:grid;grid-template-columns:96px 1fr;grid-template-rows:auto auto;column-gap:12px;align-content:center}
      .viewer-option-preview{grid-row:1/3;margin:0}
      .viewer-option strong{align-self:end}
      .viewer-option span{align-self:start}
    }
  </style>
</head>
<body>
  <section class="boot" id="boot" aria-live="polite">
    <div class="boot-card">
      <p class="boot-title" id="bootTitle">Загружаем прототип</p>
      <p class="boot-copy" id="bootCopy">Подготавливаем изображения и шрифты</p>
      <div class="boot-progress"><div class="boot-progress-bar" id="bootProgress"></div></div>
      <button class="boot-retry" id="bootRetry">Повторить</button>
    </div>
  </section>
  <section class="viewer-choice" id="viewerChoice" hidden>
    <div class="viewer-choice-card">
      <h1>Как открыть прототип?</h1>
      <p>Выберите удобный режим просмотра</p>
      <div class="viewer-options">
        <button class="viewer-option" data-viewer="phone">
          <span class="viewer-option-preview phone-preview" aria-hidden="true">FULL</span>
          <strong>На телефоне</strong>
          <span>Открыть на весь экран</span>
        </button>
        <button class="viewer-option" data-viewer="desktop">
          <span class="viewer-option-preview desktop-preview" aria-hidden="true">375 × 812</span>
          <strong>На компьютере</strong>
          <span>Показать в рамке смартфона</span>
        </button>
      </div>
    </div>
  </section>
  <div class="viewer-shell" id="viewerShell" hidden inert aria-hidden="true">
    <div class="variant-toggle" id="variantToggle" aria-label="Вариант прототипа">
      <button class="variant-button active" data-metrics="false">Без метрик</button>
      <button class="variant-button" data-metrics="true">С метриками</button>
    </div>
    <div class="device-wrap">
      <div class="device">
        <div class="system-status" aria-hidden="true"><img src="./assets/status-bar.png" alt=""></div>
        <div class="prototype-stage">
  <main class="app" id="app">
    <header class="sticky-header" id="stickyHeader">
      <button class="back" aria-label="Назад"><img src="./assets/icon3.svg" alt=""></button>
      <div class="sticky-title">Скидка на доставку</div>
    </header>
    <div class="scroll" id="scroll">
      <section class="hero">
        <div class="hero-background"></div>
        <button class="back" aria-label="Назад"><img src="./assets/icon3.svg" alt=""></button>
        <div class="hero-copy"><h1>Скидка<br>на доставку</h1><p>Чтобы сделать товары привлекательнее</p></div>
        <div class="art-viewport" aria-hidden="true"><div class="art"><img class="art-shadow-main" src="./assets/ellipse3438.svg"><img class="art-shadow-plant-large" src="./assets/ellipse29603.svg"><img class="art-shadow-plant-small" src="./assets/ellipse29604.svg"><img class="van" src="./assets/van-cat-green.png"><img class="plant" src="./assets/plant-box.png"><img class="bag" src="./assets/shopping-bag.png"><div class="promo-badge"><img src="./assets/promo-badge.svg"></div></div></div>
        <div class="metrics" id="heroMetrics"></div>
        <div class="auto-row" id="autoRow" hidden><button class="switch" id="autoSwitch" role="switch" aria-checked="false"><img src="./assets/switch-inactive.svg" alt=""></button><span>Включать на новые товары</span><button class="auto-arrow" data-sheet="auto" aria-label="Настроить"><img src="./assets/arrow-forward.svg" alt=""></button></div>
      </section>
      <nav class="tabs"><button class="tab active" data-tab="eligible">Подходят<small>40</small></button><button class="tab" data-tab="discounted">Со скидкой<small id="discountedCount">1</small></button></nav>
      <section class="catalog" id="catalog"></section>
    </div>
    <section class="select-all-footer" id="selectAllFooter">
      <button class="select-all-pill" id="selectAll"><img src="./assets/checkbox-inactive.svg" alt=""><span>Выбрать все товары</span></button>
    </section>
    <section class="selection" id="selection">
      <div class="count-pill"><button class="check active" id="clearSelection" aria-label="Снять выбор"><img src="./assets/checkbox-active.svg" alt=""></button><span id="selectionCount"></span></div>
      <div class="calculator"><div class="calculator-controls"><div class="options" id="selectionOptions"></div><button class="primary" id="applyDiscount">Применить</button></div></div>
    </section>
    <div class="backdrop" id="backdrop"><section class="sheet" id="sheet"></section></div>
    <div class="toast" id="toast"></div>
  </main>
        </div>
        <div class="system-home" aria-hidden="true"></div>
      </div>
    </div>
  </div>
  <script>
    const categories=[
      {name:'Обувь',items:[
        {id:'salomon',price:1000,title:'Кроссовки Salomon',image:'./assets/product-salomon.png',minimum:50,maximum:800,ai:200},
        {id:'diesel',price:5000,title:'Ботинки Diesel',image:'./assets/product-diesel.png',appliedImage:'./assets/product-diesel-applied.png',minimum:50,maximum:1500,ai:135}]},
      {name:'Постельное бельё',items:[
        {id:'turquoise',price:2000,title:'Постельное бельё ИКЕА Бирюза',image:'./assets/image1.png',minimum:200,maximum:1000,ai:200},
        {id:'ocean',price:3000,title:'Постельное бельё ИКЕА Океан',image:'./assets/product-bedding-turquoise.png',minimum:140,maximum:1200,ai:140},
        {id:'rose',price:5000,title:'Постельное бельё ИКЕА Роза',image:'./assets/product-bedding-ocean.png',minimum:210,maximum:1500,ai:210},
        {id:'carrots',price:2000,title:'Постельное бельё ИКЕА Морковки',image:'./assets/product-bedding-carrots.png',minimum:220,maximum:1000,ai:220}]},
      {name:'Светильники',items:[
        {id:'lamp-round',price:1000,title:'Светильник круглый',image:'./assets/product-lamp-round.png',minimum:50,maximum:800,ai:120},
        {id:'lamp-kitchen',price:3000,title:'Светильник для кухни',image:'./assets/product-lamp-kitchen.png',minimum:150,maximum:1200,ai:180},
        {id:'lamp-tall',price:4000,title:'Светильник высокий туба',image:'./assets/product-lamp-tall.png',minimum:200,maximum:1500,ai:260}]}
    ];
    const lyali={id:'lyali',price:1000,title:'Ляли кожанные',image:'./assets/product-lyali.png',minimum:50,maximum:800,ai:160};
    const allItems=categories.flatMap(category=>category.items);
    const state={tab:'eligible',selected:new Set(),applied:new Map([[lyali.id,160]]),selectionLevel:'ai',manualAmount:null,auto:false,autoAvailable:false,priceBand:0,metrics:false};
    const rubles=value=>new Intl.NumberFormat('ru-RU').format(value)+' ₽';
    const discount=(item,level)=>{
      if(state.manualAmount!==null)return Math.min(item.maximum,Math.max(item.minimum,state.manualAmount));
      if(level==='ai')return item.ai;
      const amounts=state.selected.size>1
        ?{minimum:400,great:500,strong:600}
        :{minimum:100,great:300,strong:400};
      return Math.min(item.maximum,Math.max(item.minimum,amounts[level]??item.ai));
    };
    const eligibleItems=()=>allItems.filter(item=>!state.applied.has(item.id));
    const discountedItems=()=>[...(state.applied.has(lyali.id)?[lyali]:[]),...allItems.filter(item=>state.applied.has(item.id))];
    const visibleItems=()=>state.tab==='eligible'?eligibleItems():discountedItems();
    const selectedItems=()=>visibleItems().filter(item=>state.selected.has(item.id));
    const productWord=count=>count%10===1&&count%100!==11?'товар':count%10>=2&&count%10<=4&&(count%100<12||count%100>14)?'товара':'товаров';
    const rangeLabel=(items,level)=>{
      const values=items.map(item=>discount(item,level));
      if(!values.length)return '0 ₽';
      const minimum=Math.min(...values);
      const maximum=Math.max(...values);
      return minimum===maximum?rubles(minimum):rubles(minimum).replace(' ₽','')+'–'+rubles(maximum);
    };
    const catalog=document.getElementById('catalog');
    const app=document.getElementById('app');
    const scroll=document.getElementById('scroll');
    const stickyHeader=document.getElementById('stickyHeader');
    const selectAllFooter=document.getElementById('selectAllFooter');
    const selection=document.getElementById('selection');
    const selectionCount=document.getElementById('selectionCount');
    const selectionOptions=document.getElementById('selectionOptions');
    const discountedCount=document.getElementById('discountedCount');
    const backdrop=document.getElementById('backdrop');
    const sheet=document.getElementById('sheet');
    const toast=document.getElementById('toast');
    const boot=document.getElementById('boot');
    const bootTitle=document.getElementById('bootTitle');
    const bootCopy=document.getElementById('bootCopy');
    const bootProgress=document.getElementById('bootProgress');
    const bootRetry=document.getElementById('bootRetry');
    const viewerChoice=document.getElementById('viewerChoice');
    const viewerShell=document.getElementById('viewerShell');
    const variantToggle=document.getElementById('variantToggle');
    const heroMetrics=document.getElementById('heroMetrics');
    const hero=document.querySelector('.hero');
    const autoRow=document.getElementById('autoRow');
    const autoSwitch=document.getElementById('autoSwitch');
    const imageAssets=[
      './assets/ai.svg','./assets/ai-marker.png','./assets/question-white.svg','./assets/clear-input.svg','./assets/slider-thumb.svg','./assets/keyboard-delete.svg','./assets/status-bar-plain.png','./assets/metrics-heart.svg','./assets/metrics-eye.svg','./assets/arrow-forward.svg','./assets/checkbox-active.svg','./assets/checkbox-inactive.svg',
      './assets/close.svg','./assets/ellipse29603.svg','./assets/ellipse29604.svg',
      './assets/ellipse3438.svg','./assets/help.svg','./assets/help1.svg','./assets/icon.svg',
      './assets/icon2.svg','./assets/icon3.svg','./assets/icon4.svg','./assets/image1.png',
      './assets/metrics-arrow.svg','./assets/metrics-eye.png','./assets/metrics-heart.png',
      './assets/plant-box.png','./assets/product-bedding-carrots.png',
      './assets/product-bedding-ocean.png','./assets/product-bedding-turquoise.png',
      './assets/product-diesel.png','./assets/product-lamp-kitchen.png',
      './assets/product-lamp-round.png','./assets/product-lamp-tall.png',
      './assets/product-oakley.png','./assets/product-salomon.png','./assets/promo-badge.svg',
      './assets/product-lyali.png','./assets/product-diesel-applied.png','./assets/ai-spark.svg',
      './assets/ai-auto.svg','./assets/toast-close.svg',
      './assets/shopping-bag.png','./assets/status-bar.png','./assets/switch-active.svg',
      './assets/switch-inactive.svg','./assets/van-cat-green.png'
    ];
    const fontAssets=[
      {url:'./assets/avito-sans-text-regular.woff2',weight:400},
      {url:'./assets/avito-sans-text-medium.woff2',weight:500},
      {url:'./assets/avito-sans-text-semibold.woff2',weight:600},
      {url:'./assets/avito-sans-text-bold.woff2',weight:700},
      {url:'./assets/avito-sans-text-extrabold.woff2',weight:800}
    ];
    const preparedResources=new Set();
    const warmedImages=[];

    function checkButton(active,label){
      return '<button class="check '+(active?'active':'')+'" aria-label="'+label+'"><img src="./assets/checkbox-'+(active?'active':'inactive')+'.svg" alt=""></button>';
    }

    function selectedDiscount(item){
      if(!state.selected.has(item.id))return null;
      return discount(item,state.selectionLevel);
    }

    function productMarkup(item,selected,applied){
      const badge=selected?selectedDiscount(item):applied;
      const image=applied&&item.appliedImage?item.appliedImage:item.image;
      return '<article class="product" data-id="'+item.id+'"><img class="product-image" src="'+image+'" alt=""><span class="product-check">'+checkButton(selected,selected?'Снять выбор':'Выбрать товар')+'</span><div class="product-body"><div class="product-price">'+rubles(item.price)+(badge?'<span class="discount-badge"><img src="./assets/icon2.svg" alt="">Скидка '+rubles(badge)+'</span>':'')+'</div><div class="product-title">'+item.title+'</div></div></article>';
    }

    function discountedMarkup(){
      return categories.map(category=>{
        const items=category.name==='Обувь'
          ?[...(state.applied.has(lyali.id)?[lyali]:[]),...category.items.filter(item=>state.applied.has(item.id))]
          :category.items.filter(item=>state.applied.has(item.id));
        if(!items.length)return '';
        const chosen=items.every(item=>state.selected.has(item.id));
        return '<div class="category"><div class="category-title" data-category="'+category.name+'">'+checkButton(chosen,chosen?'Снять выбор с категории':'Выбрать категорию')+'<span>'+category.name+'</span></div>'+items.map(item=>productMarkup(item,state.selected.has(item.id),state.applied.get(item.id))).join('')+'</div>';
      }).join('')||'<div class="empty">Здесь появятся товары со скидкой</div>';
    }

    function renderCatalog(){
      discountedCount.textContent=state.applied.size;
      document.querySelectorAll('.tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.tab===state.tab));
      if(state.tab==='discounted'){
        catalog.innerHTML=discountedMarkup();
        selectAllFooter.classList.add('hidden');
        renderSelection();
        return;
      }
      catalog.innerHTML=categories.map(category=>{
        const items=category.items.filter(item=>!state.applied.has(item.id));
        if(!items.length)return '';
        const chosen=items.every(item=>state.selected.has(item.id));
        return '<div class="category"><div class="category-title" data-category="'+category.name+'">'+checkButton(chosen,chosen?'Снять выбор с категории':'Выбрать категорию')+'<span>'+category.name+'</span></div>'+items.map(item=>productMarkup(item,state.selected.has(item.id),null)).join('')+'</div>';
      }).join('');
      renderSelection();
    }

    function renderSelection(){
      const items=selectedItems();
      selection.classList.toggle('visible',items.length>0);
      app.classList.toggle('has-selection',items.length>0);
      selectAllFooter.classList.toggle('hidden',items.length>0||state.tab!=='eligible');
      if(!items.length)return;
      selectionOptions.classList.toggle('multiple',items.length>1);
      const aiSelected=state.tab==='eligible'&&state.selectionLevel==='ai'&&state.manualAmount===null;
      selectionCount.innerHTML=items.length+' '+productWord(items.length)+(aiSelected?'<span class="selection-ai">· Совет ИИ <img src="./assets/ai-spark.svg" alt=""></span>':'');
      const applyButton=document.getElementById('applyDiscount');
      applyButton.textContent=state.tab==='eligible'?'Применить':'Удалить скидку';
      applyButton.classList.toggle('secondary',state.tab==='discounted');
      const levels=[
        {key:'minimum',ai:false},
        {key:'ai',ai:true},
        {key:'great',ai:false},
        {key:'strong',ai:false}
      ];
      selectionOptions.innerHTML=levels.map(level=>{
        const active=state.manualAmount===null&&state.selectionLevel===level.key;
        const label=items.length>1&&level.key==='ai'
          ?'400 – 800 ₽'
          :items.length>1
            ?{minimum:'400 ₽',great:'500 ₽',strong:'600 ₽'}[level.key]
            :level.key==='ai'
              ?rubles(Math.ceil(items[0].ai/100)*100)
              :rangeLabel(items,level.key);
        const activeClass=active?(state.tab==='discounted'?'applied-active':'active'):'';
        return '<button class="chip choice-chip '+(level.ai?'ai-choice ':'')+activeClass+'" data-level="'+level.key+'">'+label+'</button>';
      }).join('')+'<button class="chip edit-chip '+(state.manualAmount!==null?'active':'')+'" data-sheet="custom" aria-label="Задать свою скидку"><img src="./assets/icon4.svg" alt=""></button>';
    }

    function renderHeroMetrics(){
      heroMetrics.classList.toggle('metrics-data',state.metrics);
      if(state.metrics){
        heroMetrics.innerHTML='<div class="metric"><strong>+86 <img src="./assets/metrics-heart.svg" alt=""></strong><span>Добавлений<br>в избранное</span></div><div class="metric"><strong>+120 <img src="./assets/metrics-eye.svg" alt=""></strong><span>Количество<br>просмотров</span></div><button class="metric metric-action" data-sheet="metrics"><span class="metric-action-icon"><span><img src="./assets/metrics-arrow.svg" alt=""></span></span><span class="metric-action-label">Как мы это считаем</span></button>';
      }else{
        heroMetrics.innerHTML='<div class="metric"><strong>x2,5</strong><span>Растет скорость продажи</span></div><div class="metric"><strong>x3</strong><span>Растёт количество покупателей</span></div>';
      }
      variantToggle.querySelectorAll('[data-metrics]').forEach(button=>button.classList.toggle('active',(button.dataset.metrics==='true')===state.metrics));
    }

    let toastTimer;

    function renderAutoState(){
      autoRow.hidden=!state.autoAvailable;
      hero.classList.toggle('auto-enabled',state.autoAvailable);
      hero.style.height=state.autoAvailable?'310px':'264px';
      autoSwitch.classList.toggle('active',state.auto);
      autoSwitch.setAttribute('aria-checked',String(state.auto));
      autoSwitch.querySelector('img').src=state.auto?'./assets/switch-active.svg':'./assets/switch-inactive.svg';
    }

    function showToast(message,sticky=false){
      clearTimeout(toastTimer);
      toast.innerHTML='<span>'+message+'</span><button class="toast-close" aria-label="Закрыть"><img src="./assets/toast-close.svg" alt=""></button>';
      toast.classList.add('visible');
      if(!sticky)toastTimer=setTimeout(()=>toast.classList.remove('visible'),3200);
    }

    function resetPrototype(){
      state.tab='eligible';
      state.selected.clear();
      state.applied.clear();
      state.applied.set(lyali.id,160);
      state.selectionLevel='ai';
      state.manualAmount=null;
      state.auto=false;
      state.autoAvailable=false;
      state.priceBand=0;
      state.metrics=false;
      scroll.scrollTop=0;
      updateHeader();
      closeSheet();
      sheet.innerHTML='';
      toast.classList.remove('visible');
      renderAutoState();
      renderHeroMetrics();
      renderCatalog();
    }

    function loadImage(url){
      return new Promise((resolve,reject)=>{
        const image=new Image();
        const timeout=setTimeout(()=>reject(new Error('Таймаут загрузки '+url)),20000);
        image.onload=async()=>{
          try{
            if(image.decode)await image.decode();
            clearTimeout(timeout);
            warmedImages.push(image);
            resolve();
          }catch(error){
            clearTimeout(timeout);
            reject(error);
          }
        };
        image.onerror=()=>{
          clearTimeout(timeout);
          reject(new Error('Не удалось загрузить '+url));
        };
        image.src=url;
      });
    }

    async function loadFont(font){
      const response=await fetch(font.url,{cache:'force-cache'});
      if(!response.ok)throw new Error('Не удалось загрузить '+font.url);
      await response.arrayBuffer();
      const faces=await document.fonts.load(font.weight+' 16px "Avito Sans Text"');
      if(!faces.length)throw new Error('Не удалось подготовить '+font.url);
    }

    async function loadRequiredResources(){
      boot.classList.remove('error');
      bootTitle.textContent='Загружаем прототип';
      bootCopy.textContent='Подготавливаем изображения и шрифты';
      const resources=[
        ...imageAssets.map(url=>({key:url,load:()=>loadImage(url)})),
        ...fontAssets.map(font=>({key:font.url,load:()=>loadFont(font)}))
      ];
      const updateProgress=()=>{
        bootProgress.style.width=Math.round(preparedResources.size/resources.length*100)+'%';
      };
      updateProgress();
      try{
        const pending=resources.filter(resource=>!preparedResources.has(resource.key));
        await Promise.all(pending.map(async resource=>{
          await resource.load();
          preparedResources.add(resource.key);
          updateProgress();
        }));
        await document.fonts.ready;
        resetPrototype();
        await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
        const directMode=new URLSearchParams(location.search).get('viewer');
        if(directMode==='phone'||directMode==='desktop')startViewer(directMode);
        else showViewerChoice();
      }catch(error){
        console.error(error);
        boot.classList.add('error');
        bootTitle.textContent='Не удалось загрузить прототип';
        bootCopy.textContent='Проверьте соединение и попробуйте ещё раз';
      }
    }

    function showViewerChoice(){
      boot.hidden=true;
      viewerChoice.hidden=false;
    }

    function startViewer(mode){
      resetPrototype();
      viewerChoice.hidden=true;
      boot.hidden=true;
      viewerShell.className='viewer-shell '+mode;
      viewerShell.hidden=false;
      viewerShell.inert=false;
      viewerShell.setAttribute('aria-hidden','false');
      updateDeviceScale();
    }

    function updateDeviceScale(){
      if(viewerShell.hidden)return;
      const desktop=viewerShell.classList.contains('desktop');
      const width=desktop?395:375;
      const height=desktop?832:812;
      const horizontalMargin=desktop?32:8;
      const verticalSpace=64;
      const scale=Math.min(1,(window.innerWidth-horizontalMargin)/width,(window.innerHeight-verticalSpace)/height);
      viewerShell.style.setProperty('--device-scale',Math.max(.2,scale));
    }

    function openSheet(type){
      document.querySelector('.device').classList.remove('keyboard-open');
      if(type==='auto')renderRateSheet(true);
      if(type==='info')renderRateSheet(false);
      if(type==='custom')renderCustomSheet();
      if(type==='metrics')renderMetricsSheet();
      backdrop.classList.add('visible');
      if(type==='custom'){
        setTimeout(()=>{
          const input=document.getElementById('amountInput');
          input?.focus({preventScroll:true});
          input?.select();
        },50);
      }
    }

    function bands(){
      return[
        {label:'До 1 000 ₽',value:138,minimum:50,maximum:500},
        {label:'1 000–3 000 ₽',value:250,minimum:50,maximum:800},
        {label:'3 000–6 000 ₽',value:450,minimum:100,maximum:1200},
        {label:'6 000–10 000 ₽',value:650,minimum:200,maximum:1500},
        {label:'10 000–20 000 ₽',value:900,minimum:300,maximum:2000}
      ];
    }

    function renderRateSheet(auto){
      const band=bands()[state.priceBand];
      sheet.className='sheet '+(auto?'auto-sheet':'info-sheet');
      const close='<button class="close" aria-label="Закрыть"><img src="./assets/close.svg" alt=""></button>';
      const priceBands='<span class="sheet-label price-label">Если цена товара</span><div class="chips-row">'+bands().map((item,index)=>'<button class="chip '+(state.priceBand===index?'active':'')+'" data-band="'+index+'" data-auto="'+auto+'">'+item.label+'</button>').join('')+'</div>';
      if(auto){
        sheet.innerHTML=close+'<h2>Включать новым товарам<br>скидку на доставку?</h2><p class="auto-copy">Нейросеть будет автоматически подключать новым обьявлениям скидку.</p>'+priceBands+'<span class="auto-result-label">Скидка на доставку составит:</span><div class="auto-result"><strong><img src="./assets/ai-auto.svg" alt="">'+rubles(band.value)+'</strong><span>ИИ выберет скидку из диапазона<br>от '+rubles(band.minimum)+' до '+rubles(band.maximum)+' и установит её на товар</span></div><div class="sheet-footer"><button class="primary" id="enableAuto">Включать новым товарам</button></div>';
      }else{
        sheet.innerHTML=close+'<h2>Как нейросеть выбирает скидку</h2><p>ИИ учитывает цену каждого товара и предлагает подходящую скидку в доступном диапазоне.</p>'+priceBands+'<span class="sheet-label discount-label">Доступный диапазон</span><div class="result-card info-result"><strong>'+rubles(band.minimum).replace(' ₽','')+'–'+rubles(band.maximum)+'</strong><span>Рекомендация для этого диапазона — ≈ '+rubles(band.value)+'</span></div>';
      }
    }

    function renderMetricsSheet(){
      sheet.className='sheet metrics-sheet';
      sheet.innerHTML='<button class="close" aria-label="Закрыть"><img src="./assets/close.svg" alt=""></button><h2>Данные о скидках</h2><div class="metrics-summary"><strong>287</strong><p>Товаров подключались к скидке на доставку за период 29 июля – 28 августа</p><div class="metrics-growth"><div class="growth-row"><strong>+120</strong><img src="./assets/metrics-eye.png" alt=""><span>Прибавилось просмотров</span></div><div class="growth-row"><strong>+24</strong><img src="./assets/metrics-heart.png" alt=""><span>Выросло добавлений в избранное</span></div></div></div><div class="metrics-explanation"><h3>Как мы считаем показатели?</h3><div class="metrics-step"><span class="metrics-step-visual"></span><p>Считаем количество товаров которым вы подключали скидки</p></div><div class="metrics-step"><span class="metrics-step-visual"></span><p>Отслеживаем прирост просмотров и добавлений в избранное после подключения скидок</p></div><div class="metrics-step"><span class="metrics-step-visual"></span><p>Обновляем данные раз в сутки, суммируя показатели за 30 дней</p></div></div>';
    }

    function keyboardMarkup(){
      const letters=['','АБВГ','ДЕЖЗ','ИЙКЛ','МНОП','РСТУ','ФХЦЧ','ШЩЪЫ','ЬЭЮЯ'];
      const keys=letters.map((label,index)=>'<button class="numeric-key" data-key="'+(index+1)+'" aria-label="'+(index+1)+'"><span>'+(index+1)+'</span><small>'+label+'</small></button>').join('');
      return '<div class="numeric-keyboard" aria-label="Цифровая клавиатура">'+keys+'<span></span><button class="numeric-key" data-key="0">0</button><button class="numeric-key delete-key" data-key="delete" aria-label="Удалить цифру"><img src="./assets/keyboard-delete.svg" alt=""></button></div>';
    }

    function updateManualInput(){
      const input=document.getElementById('amountInput');
      const slider=document.getElementById('amountSlider');
      if(!input||!slider)return;
      input.style.width=Math.max(1,input.value.length)+'ch';
      const value=Math.min(Number(slider.max),Math.max(Number(slider.min),Number(input.value)||0));
      slider.value=value;
      slider.style.setProperty('--progress',(value-Number(slider.min))/(Number(slider.max)-Number(slider.min))*100+'%');
      const affected=selectedItems().filter(item=>item.minimum>value);
      sheet.querySelectorAll('.slider-product-marker').forEach(marker=>{
        marker.hidden=Number(marker.dataset.minimum)<=value;
      });
      const save=document.getElementById('saveCustom');
      if(save)save.textContent=affected.length?'Готово':'Применить';
      if(affected.length){
        showToast(affected.length+' '+(affected.length===1?'товару':'товарам')+' скидка не подходит. Установили для них минимальную. Вы увидите скидки у товаров, перед тем, как применить',true);
      }else{
        clearTimeout(toastTimer);
        toast.classList.remove('visible');
      }
    }

    function closeSheet(){
      const keyboardWasOpen=document.querySelector('.device').classList.contains('keyboard-open');
      document.activeElement?.blur();
      backdrop.classList.remove('visible');
      document.querySelector('.device').classList.remove('keyboard-open');
      if(keyboardWasOpen){
        clearTimeout(toastTimer);
        toast.classList.remove('visible');
      }
    }

    function renderCustomSheet(){
      const items=selectedItems();
      const item=items[0];
      if(!item)return;
      const minimum=items.length>1?50:item.minimum;
      const maximum=items.length>1?1500:item.maximum;
      const current=state.manualAmount??(items.length>1?400:(state.tab==='discounted'?state.applied.get(item.id):item.ai));
      const value=Math.min(maximum,Math.max(minimum,current));
      const progress=(value-minimum)/(maximum-minimum)*100;
      const markers=items.map(selected=>{
        const position=Math.min(100,Math.max(0,(selected.minimum-minimum)/(maximum-minimum)*100));
        return '<span class="slider-product-marker" data-minimum="'+selected.minimum+'" style="--marker:'+position+'%" hidden><img src="'+selected.image+'" alt=""></span>';
      }).join('');
      sheet.className='sheet custom-sheet';
      sheet.innerHTML='<div class="manual-controls"><div class="manual-input-wrap"><input class="amount-input" id="amountInput" type="text" inputmode="none" pattern="[0-9]*" autocomplete="off" value="'+value+'" aria-label="Размер скидки"><span>₽</span><button class="clear-amount" id="clearAmount" aria-label="Очистить"><img src="./assets/clear-input.svg" alt=""></button></div><div class="slider-wrap"><input class="slider" id="amountSlider" aria-label="Скидка на доставку" type="range" step="50" min="'+minimum+'" max="'+maximum+'" value="'+value+'" style="--progress:'+progress+'%">'+markers+'<div class="slider-limits"><span>'+rubles(minimum).replace(' ₽','')+'</span><span>'+rubles(maximum).replace(' ₽','')+'</span></div></div><button class="primary" id="saveCustom">Применить</button></div>'+keyboardMarkup();
      document.querySelector('.device').classList.add('keyboard-open');
      updateManualInput();
    }

    catalog.addEventListener('click',event=>{
      const product=event.target.closest('.product');
      const category=event.target.closest('[data-category]');
      if(product){
        const id=product.dataset.id;
        state.selected.has(id)?state.selected.delete(id):state.selected.add(id);
        state.selectionLevel='ai';
        state.manualAmount=null;
        renderCatalog();
      }else if(category){
        const ids=[...category.closest('.category').querySelectorAll('.product')].map(item=>item.dataset.id);
        const allChosen=ids.every(id=>state.selected.has(id));
        ids.forEach(id=>allChosen?state.selected.delete(id):state.selected.add(id));
        state.selectionLevel='ai';
        state.manualAmount=null;
        renderCatalog();
        if(!allChosen&&state.tab==='eligible')showToast('Ai порекомендовал скидки товарам в зависимости от их цен',true);
      }
    });

    document.querySelector('.tabs').addEventListener('click',event=>{
      const tab=event.target.closest('[data-tab]');
      if(!tab)return;
      state.tab=tab.dataset.tab;
      state.selected.clear();
      state.selectionLevel='ai';
      state.manualAmount=null;
      renderCatalog();
    });

    document.getElementById('selectAll').addEventListener('click',()=>{
      eligibleItems().forEach(item=>state.selected.add(item.id));
      state.selectionLevel='ai';
      state.manualAmount=null;
      renderCatalog();
      showToast('Ai порекомендовал скидки товарам в зависимости от их цен',true);
    });

    document.getElementById('clearSelection').addEventListener('click',()=>{
      state.selected.clear();
      renderCatalog();
    });

    function updateHeader(){
      const fixed=scroll.scrollTop>=218;
      stickyHeader.classList.toggle('visible',fixed);
      const image=document.querySelector('.system-status img');
      const asset=fixed?'./assets/status-bar-plain.png':'./assets/status-bar.png';
      if(image.getAttribute('src')!==asset)image.src=asset;
    }

    scroll.addEventListener('scroll',updateHeader,{passive:true});

    selectionOptions.addEventListener('click',event=>{
      const level=event.target.closest('[data-level]');
      const sheetButton=event.target.closest('[data-sheet]');
      if(level){
        state.selectionLevel=level.dataset.level;
        state.manualAmount=null;
        if(state.selectionLevel!=='ai'){
          clearTimeout(toastTimer);
          toast.classList.remove('visible');
        }
        renderCatalog();
      }
      if(sheetButton){
        clearTimeout(toastTimer);
        toast.classList.remove('visible');
        openSheet(sheetButton.dataset.sheet);
      }
    });

    document.getElementById('applyDiscount').addEventListener('click',async()=>{
      const items=selectedItems();
      if(!items.length)return;
      if(state.tab==='discounted'){
        items.forEach(item=>state.applied.delete(item.id));
        state.selected.clear();
        state.manualAmount=null;
        renderCatalog();
        showToast('Скидка удалена');
        return;
      }
      items.forEach(item=>document.querySelector('.product[data-id="'+item.id+'"]')?.classList.add('removing'));
      await new Promise(resolve=>setTimeout(resolve,230));
      items.forEach(item=>{
        const value=discount(item,state.selectionLevel);
        state.applied.set(item.id,value);
      });
      state.selected.clear();
      state.manualAmount=null;
      renderCatalog();
      if(!state.autoAvailable)openSheet('auto');
      else showToast('Скидка применена к '+items.length+' '+(items.length===1?'товару':'товарам'));
    });

    autoSwitch.addEventListener('click',()=>{
      state.auto=!state.auto;
      renderAutoState();
    });

    document.addEventListener('click',event=>{
      const trigger=event.target.closest('[data-sheet]');
      if(trigger&&!trigger.closest('#selectionOptions'))openSheet(trigger.dataset.sheet);
    });

    backdrop.addEventListener('click',event=>{
      if(event.target===backdrop||event.target.closest('.close'))closeSheet();
    });

    sheet.addEventListener('click',event=>{
      const band=event.target.closest('[data-band]');
      if(band){
        state.priceBand=Number(band.dataset.band);
        renderRateSheet(band.dataset.auto==='true');
      }
      if(event.target.closest('[data-details]'))renderRateSheet(false);
      if(event.target.id==='enableAuto'){
        state.auto=true;
        state.autoAvailable=true;
        renderAutoState();
        closeSheet();
        showToast('Скидка для новых товаров включена');
      }
      const key=event.target.closest('[data-key]');
      if(key){
        const input=document.getElementById('amountInput');
        const start=input.selectionStart??input.value.length;
        const end=input.selectionEnd??start;
        const deleting=key.dataset.key==='delete';
        const from=deleting&&start===end?Math.max(0,start-1):start;
        const digit=deleting?'':key.dataset.key;
        input.value=(input.value.slice(0,from)+digit+input.value.slice(end)).slice(0,6);
        const cursor=Math.min(from+digit.length,input.value.length);
        input.focus({preventScroll:true});
        input.setSelectionRange(cursor,cursor);
        updateManualInput();
      }
      if(event.target.closest('#clearAmount')){
        const input=document.getElementById('amountInput');
        input.value='';
        updateManualInput();
        input.focus({preventScroll:true});
      }
      if(event.target.id==='saveCustom'){
        const items=selectedItems();
        if(items.length){
          const minimum=items.length>1?50:items[0].minimum;
          const maximum=items.length>1?1500:items[0].maximum;
          const input=document.getElementById('amountInput');
          state.manualAmount=Math.min(maximum,Math.max(minimum,Number(input.value)||minimum));
        }
        closeSheet();
        renderCatalog();
      }
    });

    sheet.addEventListener('pointerdown',event=>{
      if(event.target.closest('[data-key],#clearAmount'))event.preventDefault();
    });

    sheet.addEventListener('input',event=>{
      if(!['amountInput','amountSlider'].includes(event.target.id))return;
      const input=document.getElementById('amountInput');
      if(event.target.id==='amountSlider')input.value=event.target.value;
      else input.value=input.value.replace(/[^0-9]/g,'').slice(0,6);
      updateManualInput();
    });

    sheet.addEventListener('keydown',event=>{
      if(event.key==='Enter'&&event.target.id==='amountInput')document.getElementById('saveCustom').click();
      if(event.key==='Escape')closeSheet();
    });

    toast.addEventListener('click',event=>{
      if(!event.target.closest('.toast-close'))return;
      clearTimeout(toastTimer);
      toast.classList.remove('visible');
    });

    variantToggle.addEventListener('click',event=>{
      const button=event.target.closest('[data-metrics]');
      if(!button)return;
      state.metrics=button.dataset.metrics==='true';
      renderHeroMetrics();
    });

    viewerChoice.addEventListener('click',event=>{
      const option=event.target.closest('[data-viewer]');
      if(option)startViewer(option.dataset.viewer);
    });

    bootRetry.addEventListener('click',loadRequiredResources);
    window.addEventListener('resize',updateDeviceScale,{passive:true});
    loadRequiredResources();
  </script>
</body>
</html>
